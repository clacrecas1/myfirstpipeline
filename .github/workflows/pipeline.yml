name: Pipeline CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permiso mínimo: el token automático del flujo solo puede leer el repositorio
permissions:
  contents: read

jobs:
  ci:
    name: CI - calidad, seguridad y pruebas
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por commit: una etiqueta se puede mover, un SHA no
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Calidad de código (flake8)
        run: flake8 --statistics

      - name: Análisis estático de seguridad, SAST (Bandit)
        run: bandit -r app.py saludar.py

      - name: Vulnerabilidades en dependencias, SCA (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Pruebas unitarias y de API con cobertura (pytest)
        run: >
          pytest -v --cov=app --cov=saludar --cov-report=term-missing
          --cov-report=xml --cov-fail-under=90

      - name: Guardar informe de cobertura
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: coverage.xml

  docker:
    name: CD - imagen Docker
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construir la imagen
        run: docker build -t saludos-api:ci .

      - name: Prueba de humo sobre el contenedor
        run: |
          docker run -d --name api -p 8000:8000 saludos-api:ci
          for intento in $(seq 1 15); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          curl -fsS "http://localhost:8000/saludo?nombre=Claudia" | grep -q Claudia
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://localhost:8000/saludo?nombre=%3Cscript%3E")
          test "$codigo" = "400"
          test "$(docker exec api id -u)" != "0"
          docker rm -f api

      - name: Escanear la imagen (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: saludos-api:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      # Solo se publica desde main y se publica la misma imagen ya probada
      - name: Publicar en Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          for etiqueta in "$COMMIT" latest; do
            docker tag saludos-api:ci "$DOCKERHUB_USERNAME/saludos-api:$etiqueta"
            docker push "$DOCKERHUB_USERNAME/saludos-api:$etiqueta"
          done
