# Python CircleCI 2.1 configuration file - pipeline v2
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.13

    working_directory: ~/repo

    steps:
      # Step 1: obtenemos codigo fuente
      - checkout
      # Step 2: creamos venv e instalamos dependencias de app y de CI
      - run:
          name: install dependencies
          command: |
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements-dev.txt
      # Step 3: calidad de codigo
      - run:
          name: flake8
          command: |
            source venv/bin/activate
            flake8 --statistics
      # Step 4: analisis estatico de seguridad (SAST)
      - run:
          name: bandit
          command: |
            source venv/bin/activate
            bandit -r app.py saludar.py
      # Step 5: pruebas unitarias y de API con cobertura minima del 90 %
      - run:
          name: run tests
          command: |
            source venv/bin/activate
            mkdir -p test-results
            pytest -v --cov=app --cov=saludar --cov-fail-under=90 --junitxml=test-results/junit.xml
      # Step 6: publicar resultados en la pestaña Tests de CircleCI
      - store_test_results:
          path: test-results

workflows:
  ci:
    jobs:
      - build
